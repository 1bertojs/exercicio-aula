<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tabela 3</title>
</head>
<body>
    <table border="2">
        <thead>
          <tr>
            <th>curso</th>
            <th>duração</th>
            <th>turno</th>
          </tr>
        </thead>
        <tbody>
            <tr>
            <td>web design</td>
            <td>6 meses</td>
            <td>noite</td>
        </tr>
        <tr>
            <td>informatica</td>
            <td>1 ano</td>
            <td>tarde</td>
        </tr>
    </tbody>
    <tfoot>
        <td colspan="3">outros cursos em breve</td>
    </tfoot>
</body>
</html>
